# Local PostgreSQL for backups and restore tests.
# Credentials match .env.example. The volume init script loads a small schema.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: infrawatch
      POSTGRES_PASSWORD: infrawatch
      POSTGRES_DB: app
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/sample_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infrawatch -d app"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
