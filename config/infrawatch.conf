# Local checkout defaults. Already-set variables (from .env or the environment)
# are left alone. Host installs use config/infrawatch.system.conf via install.sh.

PGHOST="${PGHOST:-127.0.0.1}"
PGPORT="${PGPORT:-5432}"
PGUSER="${PGUSER:-infrawatch}"
PGDATABASE="${PGDATABASE:-app}"

BACKUP_DIR="${BACKUP_DIR:-${INFRAWATCH_ROOT}/var/backups}"
LOG_DIR="${LOG_DIR:-${INFRAWATCH_ROOT}/var/log}"
STATE_DIR="${STATE_DIR:-${INFRAWATCH_ROOT}/var/state}"

# Age-based retention. The newest RETENTION_MIN_KEEP dumps are always kept,
# even when they are older than RETENTION_DAYS.
RETENTION_DAYS="${RETENTION_DAYS:-14}"
RETENTION_MIN_KEEP="${RETENTION_MIN_KEEP:-3}"

RESTORE_SCRATCH_DB="${RESTORE_SCRATCH_DB:-infrawatch_scratch}"
# 1 = leave the scratch database after a successful restore test.
KEEP_SCRATCH="${KEEP_SCRATCH:-0}"
# 1 = leave the scratch database when the test fails, so it can be inspected.
KEEP_SCRATCH_ON_FAILURE="${KEEP_SCRATCH_ON_FAILURE:-1}"

# 1-minute load average divided by the number of CPUs.
CPU_LOAD_PER_CORE="${CPU_LOAD_PER_CORE:-1.5}"
# Percent of MemTotal that is not MemAvailable.
MEM_USED_PERCENT="${MEM_USED_PERCENT:-90}"
# Integer percent from df. Alert when used percent is greater than this.
DISK_USED_PERCENT="${DISK_USED_PERCENT:-85}"
DISK_PATHS="${DISK_PATHS:-/}"

# Space-separated systemd units that must be active. Empty skips the check,
# which is what you want on a laptop that does not run the postgresql unit.
SYSTEMD_UNITS="${SYSTEMD_UNITS:-}"

# Active queries older than this many seconds. 0 disables the check.
# pg_dump, pg_restore, and this toolkit's own sessions are ignored.
LONG_QUERY_SECONDS="${LONG_QUERY_SECONDS:-300}"

# Re-send an alert for a check that is still failing, in seconds.
ALERT_REPEAT_SECONDS="${ALERT_REPEAT_SECONDS:-3600}"

# Optional executable. On an alert it receives:
#   ALERT_SEVERITY, ALERT_CHECK, ALERT_MESSAGE
ALERT_COMMAND="${ALERT_COMMAND:-}"

PGCONNECT_TIMEOUT="${PGCONNECT_TIMEOUT:-10}"
