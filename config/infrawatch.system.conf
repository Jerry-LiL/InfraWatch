# Installed to /etc/infrawatch/infrawatch.conf by bin/install.sh.
# Password stays in /etc/infrawatch/infrawatch.env (PGPASSWORD=...), mode 640.
# For peer auth on the local socket, set PGHOST=/var/run/postgresql and omit
# the password.

PGHOST="${PGHOST:-127.0.0.1}"
PGPORT="${PGPORT:-5432}"
PGUSER="${PGUSER:-infrawatch}"
PGDATABASE="${PGDATABASE:-app}"

BACKUP_DIR="${BACKUP_DIR:-/var/backups/infrawatch}"
LOG_DIR="${LOG_DIR:-/var/log/infrawatch}"
STATE_DIR="${STATE_DIR:-/var/lib/infrawatch}"

RETENTION_DAYS="${RETENTION_DAYS:-14}"
RETENTION_MIN_KEEP="${RETENTION_MIN_KEEP:-3}"

RESTORE_SCRATCH_DB="${RESTORE_SCRATCH_DB:-infrawatch_scratch}"
KEEP_SCRATCH="${KEEP_SCRATCH:-0}"
KEEP_SCRATCH_ON_FAILURE="${KEEP_SCRATCH_ON_FAILURE:-1}"

CPU_LOAD_PER_CORE="${CPU_LOAD_PER_CORE:-1.5}"
MEM_USED_PERCENT="${MEM_USED_PERCENT:-90}"
DISK_USED_PERCENT="${DISK_USED_PERCENT:-85}"
DISK_PATHS="${DISK_PATHS:-/ /var}"
SYSTEMD_UNITS="${SYSTEMD_UNITS:-postgresql}"
LONG_QUERY_SECONDS="${LONG_QUERY_SECONDS:-300}"
ALERT_REPEAT_SECONDS="${ALERT_REPEAT_SECONDS:-3600}"
ALERT_COMMAND="${ALERT_COMMAND:-}"
PGCONNECT_TIMEOUT="${PGCONNECT_TIMEOUT:-10}"
